---
- name: Upgrade GitLab with Geo settings
  remote_user: root
  hosts: "{{env}}"
  vars:
    upgrade_version: ""
    rpm_package: "http://192.168.1.180:8081/repository/gitlab-packages/gitlab-ee-{{ upgrade_version }}-ee.0.el9.x86_64.rpm"
    rpm_filename: "gitlab-ee-{{ upgrade_version }}-ee.0.el9.x86_64.rpm"
    rpm_path: "/tmp/{{ rpm_filename }}"
    backup_dir: "/root/govinfo"
    backup_tar: "/etc/gitlab/config_backup"

  tasks:
        - name: Get current gitlab version
          ansible.builtin.shell: "cat /opt/gitlab/version-manifest.txt | grep gitlab-ee | awk '{print $2}'"
          register: current_version

        - name: Set current GitLab version fact
          ansible.builtin.set_fact:
            gitlab_current_version: "{{ current_version.stdout }}"

        - name: Create Config-backup directory
          ansible.builtin.file:
            path: "{{ backup_dir }}/{{ gitlab_current_version }}"
            state: directory
            mode: '0755'

        - name: Backup GitLab configuration
          ansible.builtin.shell: "gitlab-ctl backup-etc --backup-path /root/govinfo/{{ gitlab_current_version }}"

        - name: Take gitlab backup
          ansible.builtin.command: gitlab-backup create

        - name: Download gitlab package
          ansible.builtin.shell: "wget --content-disposition -P /tmp {{ rpm_package }}"

        - name: Install GitLab RPM
          ansible.builtin.shell: "yum install {{ rpm_path }} -y"

        - name: Pause for 2 minutes to start the gitlab services
          ansible.builtin.pause:
            minutes: 1

        - name: Run gitlab-ctl reconfigure
          ansible.builtin.command: gitlab-ctl reconfigure

        - name: Restart GitLab
          ansible.builtin.command: gitlab-ctl restart

